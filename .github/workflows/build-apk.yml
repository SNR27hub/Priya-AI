name: Build & Release Priya AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Java version cannot be detected."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer, detected: $JAVA_MAJOR"
            exit 1
          fi

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android Licenses & Environment Setup
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 || true
          fi

          if [ ! -f "./debug.keystore" ]; then
            cp ~/.android/debug.keystore ./debug.keystore || true
          fi

          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            if [ -d "android" ]; then
              echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            fi
          fi

          if which sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: 6. Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 7. Build Debug APK
        run: |
          echo "=========================================================="
          echo "Building Priya AI Android Debug APK..."
          echo "=========================================================="
          
          # Run build using Gradle 8.5 (compatible with AGP 8.2.2)
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: 8. Verify Debug APK
        id: verify_apk
        run: |
          mkdir -p output-apk
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$TARGET_APK" ]; then
            echo "Expected path $TARGET_APK not found. Searching outputs..."
            FOUND_APK=$(find . -type f -name "*.apk" ! -name "*androidTest*" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              TARGET_APK="$FOUND_APK"
            else
              echo "ERROR: No APK generated by Gradle."
              find . -name "*.apk" || true
              exit 1
            fi
          fi

          echo "Verified APK at: $TARGET_APK"
          cp "$TARGET_APK" output-apk/PriyaAI-v1.0-release.apk
          cp "$TARGET_APK" output-apk/app-debug.apk
          ls -lh output-apk/

      - name: 9. Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PriyaAI-v1.0-APK
          path: output-apk/PriyaAI-v1.0-release.apk
          if-no-files-found: error

      - name: 10. Upload Standard Artifact (app-debug-apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output-apk/app-debug.apk
          if-no-files-found: error

      - name: 11. Publish to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="🌸 Priya AI Assistant v1.0 (Debug APK)"
          
          NOTES=$(cat <<EOF
          ## 🌸 Priya AI Assistant - Android Debug APK
          **Nirmata:** SNR

          ### 📱 Features:
          - 💖 Realistic Indian Female Voice Assistant with 5 Moods (Girlfriend, Nakhre, Khush, Emotional, Super Assistant)
          - ⚡ Live Charger Connected, Disconnected, 100% Full & Low Battery Voice Alerts
          - 🎤 24/7 Background Wake Word ("Wake up Priya")
          - 💬 WhatsApp Auto-Message Sender & Call Announcer ("Call uthao / Call cut karo")
          - 🎵 YouTube Music Integration & Notification Learner
          - 🪟 Accessibility Floating Head / Overlay Service

          ### 📥 Installation:
          Download \`PriyaAI-v1.0-release.apk\` below and tap to install on your Android device!
          EOF
          )

          gh release create "$RELEASE_TAG" output-apk/PriyaAI-v1.0-release.apk \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest || echo "Warning: GitHub Releases publication skipped (requires 'Read and write permissions' in repository settings). APK is safely preserved in Artifacts!"

      - name: 12. Workflow Summary
        if: always()
        run: |
          echo "### 🌸 Priya AI Android APK Build Summary 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your **Priya AI APK** has been built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download:** Download \`PriyaAI-v1.0-APK\` or \`app-debug-apk\` directly from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases:** If write permissions are enabled, find the APK in your repo's **Releases** tab." >> $GITHUB_STEP_SUMMARY
